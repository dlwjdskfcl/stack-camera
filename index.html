<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="합성 카메라">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>합성 카메라</title>
<style>
  :root { color-scheme: dark; --ac: #ffd43b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: #f2f4f6; overscroll-behavior: none; font: 15px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  button, select { font: inherit; color: inherit; }
  .hide { display: none !important; }

  /* ----- 카메라 화면 ----- */
  #cam { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; user-select: none; -webkit-user-select: none; }
  #top { display: flex; align-items: center; gap: 4px; padding: calc(4px + env(safe-area-inset-top)) 8px 4px; min-height: 48px; }
  #top .sp { flex: 1; }
  .ic { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; }
  .ic.on { color: var(--ac); }
  .pill { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, .35); background: transparent; font-size: 13px; cursor: pointer; white-space: nowrap; }
  #vf { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #000; min-height: 0; }
  #box { position: absolute; overflow: hidden; border-radius: 14px; background: #111; }
  #v { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: fl .28s ease-out; }
  @keyframes fl { 0% { opacity: .85; } 100% { opacity: 0; } }
  #ring { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid var(--ac); border-radius: 50%; pointer-events: none; opacity: 0; }
  #ring.go { animation: rg 1.4s ease-out; }
  #ring.no { border-color: #9aa7b4; }
  @keyframes rg { 0% { opacity: 1; transform: scale(1.5); } 25% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #lensTag { position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 12px; background: rgba(0, 0, 0, .5); font-size: 12px; pointer-events: none; }
  #msg { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, .4); font-size: 22px; font-weight: 700; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #big small { font-size: 14px; font-weight: 400; }
  #bar { width: 60%; height: 6px; background: rgba(255, 255, 255, .25); border-radius: 3px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--ac); }
  #startBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #000; }
  #startBox button { background: #2f7de1; border: 0; border-radius: 24px; padding: 12px 22px; font-weight: 700; cursor: pointer; }

  #ctl { padding: 6px 10px 0; }
  .chips { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 40px; }
  /* 렌즈: 이름 + 작은 설명 두 줄 */
  #lens button { min-width: 64px; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .25); background: transparent; font-size: 13px; line-height: 1.25; cursor: pointer; }
  #lens button small { display: block; font-size: 10px; color: #9aa7b4; }
  #lens button.on { border-color: var(--ac); color: var(--ac); }
  #lens button.on small { color: var(--ac); }
  #zooms button { min-width: 40px; height: 40px; padding: 0 8px; border-radius: 20px; border: 0; background: rgba(255, 255, 255, .13); font-size: 12px; cursor: pointer; transition: all .12s; }
  #zooms button.on { min-width: 48px; height: 48px; border-radius: 24px; color: var(--ac); font-weight: 700; font-size: 14px; background: rgba(255, 255, 255, .2); }
  #slZoom { width: 100%; margin: 6px 0 0; accent-color: var(--ac); }
  #modes { display: flex; justify-content: center; gap: 22px; padding: 8px 0 0; font-size: 14px; }
  #modes button { border: 0; background: transparent; padding: 4px 2px; color: #c9d1d9; cursor: pointer; }
  #modes button.on { color: var(--ac); font-weight: 700; }
  #bot { display: flex; align-items: center; justify-content: space-around; padding: 8px 18px calc(14px + env(safe-area-inset-bottom)); }
  #thumb { width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); background: #222 center/cover no-repeat; cursor: pointer; font-size: 20px; }
  #shut { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 0; cursor: pointer; position: relative; }
  #shut::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shut:active::after { transform: scale(.88); }
  #shut:disabled { opacity: .4; }
  #flip { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); font-size: 22px; cursor: pointer; }
  #flip:disabled { opacity: .35; }

  /* ----- 설정 ----- */
  #set { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; z-index: 5; }
  #set .sheet { width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; margin: 0 auto; background: #182028; border-radius: 16px 16px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
  #set h2 { font-size: 16px; margin: 0 0 6px; }
  #set label { display: block; font-size: 12px; color: #9aa7b4; margin-top: 10px; }
  #set select, .wide { width: 100%; background: #26323e; border: 1px solid #3a4a5a; border-radius: 8px; padding: 10px; min-height: 44px; display: block; text-align: center; cursor: pointer; }
  #set p { font-size: 12px; color: #9aa7b4; margin: 10px 0 0; }
  #camInfo { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #c9d1d9; background: #101418; border-radius: 8px; padding: 8px; margin: 4px 0 0; }

  /* ----- 결과 화면 ----- */
  #res { position: fixed; inset: 0; overflow: auto; background: #101418; padding: calc(8px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom)); z-index: 4; }
  #res .in { max-width: 760px; margin: 0 auto; }
  #wrap { overflow: auto; max-height: 68vh; border-radius: 8px; background: #000; }
  #out { display: block; width: 100%; height: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .row button { flex: 1 1 auto; background: #26323e; border: 1px solid #3a4a5a; border-radius: 8px; padding: 9px 10px; min-height: 44px; cursor: pointer; }
  .row button.primary { background: #2f7de1; border-color: #2f7de1; font-weight: 700; }
  .row button.on { background: #b9651b; border-color: #b9651b; }
  .sl { display: grid; grid-template-columns: 96px 1fr 46px; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  .sl input { width: 100%; }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9aa7b4; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="cam">
  <div id="top">
    <button class="ic" id="btnSet" aria-label="설정">⚙</button>
    <button class="ic hide" id="btnTorch" aria-label="조명">⚡</button>
    <div class="sp"></div>
    <button class="pill" id="qN" aria-label="찍을 장수">16장</button>
    <button class="pill" id="qS" aria-label="출력 크기">2배</button>
    <button class="ic" id="btnHelp" aria-label="도움말">?</button>
  </div>
  <div id="vf">
    <div id="box"><video id="v" playsinline muted autoplay></video><div id="flash"></div><div id="ring"></div><div id="lensTag" class="hide"></div></div>
    <div id="msg"></div>
    <div id="big" class="hide"><span id="bigT"></span><div id="bar"><i></i></div><small id="bigS"></small></div>
    <div id="startBox" class="hide"><div id="startT"></div><button id="btnCam">카메라 켜기</button></div>
  </div>
  <div id="ctl">
    <div id="lens" class="chips hide"></div>
    <div id="zooms" class="chips"></div>
    <input id="slZoom" class="hide" type="range" min="1" max="4" step="0.1" value="1" aria-label="줌">
    <div id="modes"></div>
  </div>
  <div id="bot">
    <button id="thumb" aria-label="마지막 결과">🖼</button>
    <button id="shut" aria-label="찍기" disabled></button>
    <button id="flip" aria-label="앞 · 뒤 카메라 바꾸기" disabled>🔄</button>
  </div>
</div>

<div id="set" class="hide">
  <div class="sheet">
    <h2>설정</h2>
    <label>렌즈 (카메라)<select id="selCam"></select></label>
    <label>찍을 장수<select id="selN"><option>8</option><option selected>16</option><option>24</option><option>32</option></select></label>
    <label>출력 크기<select id="selS"><option value="1">1배 (잡음만 줄임)</option><option value="1.5">1.5배</option><option value="2" selected>2배 (해상도 올림)</option></select></label>
    <label>카메라 해상도<select id="selR"><option value="1920x1080" selected>FHD</option><option value="3840x2160">최대 (느림)</option><option value="1280x720">HD (빠름)</option></select></label>
    <label>이미 찍어 둔 사진으로<span class="wide" style="margin-top:4px;color:#f2f4f6;font-size:15px">사진 여러 장 골라 합성<input id="file" type="file" accept="image/*" multiple class="hide"></span></label>
    <label>지금 렌즈 이름 (폰이 종류를 안 알려 줘서 어림한 것 — 화면을 보고 틀리면 고치세요)<select id="selName"><option value="">자동</option><option>광각</option><option>초광각</option><option>망원</option><option>망원 3×</option><option>망원 5×</option><option>전면</option><option>전면 광각</option></select></label>
    <label>이 폰에서 브라우저가 알려 준 카메라</label>
    <div id="camInfo">아직 카메라를 켜지 않았어요</div>
    <p>폰에 렌즈가 더 있어도 브라우저가 알려 주지 않으면 여기서 고를 수 없어요. 줌 단추에 1× 보다 작은 값(.5× · .6×)이나 큰 값(3× · 5×)이 있으면, 그 줌이 초광각 · 망원 렌즈로 넘어가는 폰도 있어요.</p>
    <div class="row"><button id="btnProbe">렌즈 다시 확인</button><button id="btnSetX" class="primary">닫기</button></div>
    <p id="ver"></p>
  </div>
</div>

<div id="res" class="hide">
  <div class="in">
    <div class="row" style="margin-top:0"><button id="btnBack">← 카메라</button><button id="btnSave" class="primary">저장</button></div>
    <div id="wrap" style="margin-top:8px"><canvas id="out"></canvas></div>
    <div class="row">
      <button id="btnCmp">원본 1장 보기</button>
      <button id="btnZoom">확대</button>
    </div>
    <div class="sl"><span>밝기</span><input id="slEv" type="range" min="-1" max="3" step="0.1" value="0"><span id="vEv">0</span></div>
    <div class="sl"><span>어두운 곳 밝게</span><input id="slSh" type="range" min="0" max="1.5" step="0.05" value="0"><span id="vSh">0</span></div>
    <div class="sl"><span>선명도</span><input id="slUs" type="range" min="0" max="2" step="0.05" value="0.5"><span id="vUs">0.5</span></div>
    <pre id="log"></pre>
  </div>
</div>

<script src="stack.js?v=0.4.2"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var video = $('v'), out = $('out'), octx = out.getContext('2d', { willReadFrequently: true });
  var stream = null, track = null, cams = [], curDev = '', hwZoom = false, dz = 1, zoomBusy = false, zoomNext = null, torch = false, mirror = false;
  var busy = false, A = null, outImg = null, refBmp = null, cmp = false, zoom = false, starting = null, slTimer = 0, tagTimer = 0, probed = false;
  // 모드 = 장수 · 출력 크기 묶음 (삼성 카메라의 사진 · 야간처럼). ev = 결과의 처음 밝기
  var MODES = [{ id: 'fast', name: '빠르게', n: '8', s: '1', ev: 0 }, { id: 'photo', name: '사진', n: '16', s: '2', ev: 0 }, { id: 'night', name: '야간', n: '32', s: '1', ev: 1 }], mode = MODES[1];
  var LS_INFO = 'sc_cam_info2', LS_SIDE = 'sc_last_side', LS_NAME = 'sc_cam_name', info = {}, lastOf = {}, names = {};   // names = 내가 붙인 렌즈 이름
  try { info = JSON.parse(localStorage.getItem(LS_INFO) || '{}') || {}; lastOf = JSON.parse(localStorage.getItem(LS_SIDE) || '{}') || {}; names = JSON.parse(localStorage.getItem(LS_NAME) || '{}') || {}; } catch (e) {}
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  $('ver').textContent = 'v' + Stack.VER + ' · 계산은 모두 이 기기 안에서 하고 사진은 어디에도 보내지 않습니다.';

  function msg(t, ms) { $('msg').textContent = t || ''; if (ms) setTimeout(function () { if ($('msg').textContent === t) $('msg').textContent = ''; }, ms); }
  function big(t, p, s) {   // 가운데 큰 안내 (찍는 중 · 합성 중). t 가 없으면 숨김
    $('big').classList.toggle('hide', !t); if (!t) return;
    $('bigT').textContent = t; $('bigS').textContent = s || ''; $('bar').firstChild.style.width = Math.round((p || 0) * 100) + '%';
  }
  function log(t) { $('log').textContent += t + '\n'; }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function setBusy(b) {
    busy = b; $('shut').disabled = b || !stream; $('btnSet').disabled = b; $('slZoom').disabled = b; $('qN').disabled = b; $('qS').disabled = b;
    ['lens', 'zooms', 'modes'].forEach(function (id) { Array.prototype.forEach.call($(id).children, function (c) { c.disabled = b; }); });
    $('flip').disabled = b || !otherSide();
  }

  /* ----- 미리보기 틀: 영상 비율 그대로 화면에 맞춤 (디지털 줌은 이 틀 안에서 키워 실제 찍히는 범위와 같게) ----- */
  function layout() {
    var r = $('vf').getBoundingClientRect(), a = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 3 / 4, w = r.width, h = w / a;
    if (h > r.height) { h = r.height; w = h * a; }
    var b = $('box').style; b.width = Math.round(w) + 'px'; b.height = Math.round(h) + 'px'; b.left = Math.round((r.width - w) / 2) + 'px'; b.top = Math.round((r.height - h) / 2) + 'px';
  }
  function setTransform() { video.style.transform = (mirror ? 'scaleX(-1) ' : '') + (dz > 1 ? 'scale(' + dz + ')' : ''); }
  window.addEventListener('resize', layout);

  /* ----- 카메라 목록 · 이름 ----- */
  // 앞 · 뒤: 카메라가 알려 준 값 → 이름에 든 낱말 → 모르면 뒤쪽으로 침
  function sideOf(c) {
    var f = (info[c.id] || {}).face || '';
    if (f === 'user') return 'front'; if (f === 'environment') return 'back';
    if (/front|user|selfie|facetime|전면|앞/i.test(c.label)) return 'front';
    return 'back';
  }
  // 이름에 든 종류 (아이폰은 '후면 초광각 카메라' 처럼 알려 줌. 안드로이드 크롬은 'camera2 2, facing back' 뿐이라 모름)
  function kindOf(c) {
    var l = c.label || '';
    if (/초광각|ultra/i.test(l)) return '초광각'; if (/망원|tele/i.test(l)) return '망원'; if (/트리플|triple|듀얼|dual/i.test(l)) return '자동 전환'; if (/광각|wide/i.test(l)) return '광각';
    return '';
  }
  // 안드로이드 크롬은 종류를 안 알려 줌 → 어림: 뒤쪽 'camera2 0' = 광각(메인), 뒤쪽이 딱 둘이면 나머지 = 초광각 (갤럭시가 보통 이 둘만 내줌). 틀리면 ⚙ 에서 이름을 고침
  function guessOf(c) {
    var m = /camera2 (\d+), facing back/i.exec(c.label || ''); if (!m || c.side !== 'back') return '';
    var backs = cams.filter(function (x) { return x.side === 'back'; });
    if (m[1] === '0') return '광각';
    return backs.length === 2 && backs.some(function (x) { return /camera2 0, facing back/i.test(x.label); }) ? '초광각' : '';
  }
  function nameOf(c) {
    if (names[c.id]) return names[c.id];
    var same = cams.filter(function (x) { return x.side === c.side; }), k = kindOf(c) || guessOf(c);
    if (k && k !== '자동 전환') return (c.side === 'front' ? '전면 ' : '') + k;
    return (c.side === 'front' ? '전면' : '후면') + (same.length > 1 ? ' ' + (same.indexOf(c) + 1) : '');
  }
  function subOf(c) {   // 렌즈 단추 둘째 줄: 종류 · 화소 · 줌 범위 (아는 것만)
    var i = info[c.id] || {}, a = [], k = kindOf(c);
    if (k && nameOf(c).indexOf(k) < 0) a.push(k);
    if (i.mp >= 0.95) a.push(Math.round(i.mp) + 'MP');
    if (i.zmax > i.zmin) a.push(fz(i.zmin) + '~' + fz(i.zmax) + '×');
    return a.join(' · ') || (i.fail ? '못 엶' : '');
  }
  function fz(v) { return v < 1 ? v.toFixed(1).replace(/^0/, '') : String(Math.round(v * 10) / 10); }
  function curCam() { for (var i = 0; i < cams.length; i++) if (cams[i].id === curDev) return cams[i]; return null; }
  function otherSide() { var c = curCam(), s = c ? c.side : 'back'; return cams.filter(function (x) { return x.side !== s; })[0] || null; }
  function noteTrack(id, t, label) {   // 켠 카메라가 알려 주는 것(최대 화소 · 줌 범위 · 앞뒤)을 기억해 둠
    if (!id || !t) return;
    var caps = t.getCapabilities ? t.getCapabilities() : {}, st = t.getSettings ? t.getSettings() : {}, old = info[id] || {};
    if (old.w && caps.width && caps.height && old.w * old.h > caps.width.max * caps.height.max) caps.width = { max: old.w }, caps.height = { max: old.h };   // 낮은 해상도로 켰을 때 작게 알려 주는 브라우저 — 큰 값을 지킴
    info[id] = { mp: caps.width && caps.height ? caps.width.max * caps.height.max / 1e6 : 0, w: caps.width ? caps.width.max : 0, h: caps.height ? caps.height.max : 0,
      zmin: caps.zoom ? caps.zoom.min : 0, zmax: caps.zoom ? caps.zoom.max : 0, poi: !!caps.pointsOfInterest || !!(caps.focusMode && caps.focusMode.indexOf('single-shot') >= 0), fm: caps.focusMode ? caps.focusMode.join('/') : '', face: st.facingMode || (caps.facingMode && caps.facingMode[0]) || '', torch: !!caps.torch, label: label || t.label || '' };
    save(LS_INFO, info);
  }
  function listCams() {
    if (!navigator.mediaDevices.enumerateDevices) return Promise.resolve();
    return navigator.mediaDevices.enumerateDevices().then(function (ds) {
      cams = ds.filter(function (d) { return d.kind === 'videoinput' && d.deviceId; }).map(function (d) { return { id: d.deviceId, label: d.label || '' }; });
      cams.forEach(function (c) { c.side = sideOf(c); });
      renderLens();
    }).catch(function () {});
  }
  function renderLens() {
    var c = curCam(), side = c ? c.side : 'back', same = cams.filter(function (x) { return x.side === side; }), box = $('lens'), sel = $('selCam');
    box.innerHTML = '';
    same.forEach(function (x) {
      var b = document.createElement('button'), s = document.createElement('small');
      b.textContent = nameOf(x); s.textContent = subOf(x) || ' '; b.appendChild(s); b.classList.toggle('on', x.id === curDev); b.disabled = busy;
      b.onclick = function () { if (!busy && x.id !== curDev) startCam(x.id); };
      box.appendChild(b);

    zoom = !zoom; this.classList.toggle('on', zoom); this.textContent = zoom ? '화면에 맞추기' : '확대';
    out.style.width = zoom ? Math.round(out.width * 2 / (window.devicePixelRatio || 1)) + 'px' : '100%';   // 사진 1픽셀 = 화면 2픽셀
  };
  $('btnSave').onclick = function () {
    out.toBlob(function (b) {
      if (!b) { log('저장 실패'); return; }
      var d = new Date(), p = function (v) { return (v < 10 ? '0' : '') + v; }, a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'stack_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + (cmp ? '_1장' : '') + '.jpg';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 20000);
    }, 'image/jpeg', 0.95);
  };
  $('btnBack').onclick = function () { showRes(false); };
  $('thumb').onclick = function () { if (busy) return; if (A && outImg) showRes(true); else msg('아직 찍은 사진이 없어요', 2500); };
  $('btnCam').onclick = function () { startCam(); };
  $('shut').onclick = shoot;
  $('flip').onclick = flipSide;
  $('btnSet').onclick = function () { if (!busy) $('set').classList.remove('hide'); };
  $('btnSetX').onclick = function () { $('set').classList.add('hide'); };
  $('selName').onchange = function () { if (!curDev) return; if (this.value) names[curDev] = this.value; else delete names[curDev]; save(LS_NAME, names); renderLens(); showTag(); };
  $('btnProbe').onclick = function () { if (busy || !stream) return; $('set').classList.add('hide'); probe(true).then(function () { $('set').classList.remove('hide'); }); };
  $('set').onclick = function (e) { if (e.target === this) this.classList.add('hide'); };
  $('btnHelp').onclick = function () { msg('같은 곳을 연달아 여러 장 찍어 한 장으로 합칩니다 — 잡음이 줄고 해상도가 올라요. 찍는 동안 폰을 가만히, 움직이지 않는 대상으로. 초점은 알아서 맞추고, 미리보기를 누르면 그 자리에 맞춥니다.', 7000); };
  $('selR').onchange = function () { if (!busy) startCam(); };
  $('selCam').onchange = function () { if (!busy) startCam(this.value); };
  $('selN').onchange = $('selS').onchange = custom;
  $('slZoom').addEventListener('input', function () { applyZoom(); peekSlider(); });
  $('file').onchange = function () { loadFiles(this.files); };
  // 다른 앱으로 가면 카메라를 놓고, 돌아오면 다시 켬 (카메라 앱처럼)
  document.addEventListener('visibilitychange', function () {
    if (busy) return;
    if (document.hidden) stopCam(); else if (!stream) startCam();
  });
  window.addEventListener('pagehide', stopCam);
  renderModes(); layout(); startCam();
  // 서비스 워커: 한 번 연 뒤에는 인터넷이 없어도 열림 (온라인이면 늘 새 파일)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
